<meta charset="utf-8">
<title>Antrenman Takip — Bel Dostu Program</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#F4F6F5; --card:#FFFFFF; --ink:#1C2826; --ink2:#5B6B67; --line:#DDE4E1;
    --accent:#0E6E62; --accent-ink:#FFFFFF; --accent-soft:#E2F0ED;
    --warn:#B4762A; --warn-soft:#F6EBDA; --danger:#B0453C; --danger-soft:#F4E3E1;
    --ok:#2E7D4F; --ok-soft:#E1EFE6;
    --r:10px; --shadow:0 1px 3px rgba(28,40,38,.08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141A19; --card:#1D2523; --ink:#E8EEEC; --ink2:#93A39E; --line:#2C3634;
      --accent:#3FA795; --accent-ink:#0E1513; --accent-soft:#1E3330;
      --warn:#D8A054; --warn-soft:#332A1B; --danger:#D8756B; --danger-soft:#33201E;
      --ok:#5FB07E; --ok-soft:#1D2E24; --shadow:0 1px 3px rgba(0,0,0,.35); }
  }
  :root[data-theme="dark"]{ --bg:#141A19; --card:#1D2523; --ink:#E8EEEC; --ink2:#93A39E; --line:#2C3634;
    --accent:#3FA795; --accent-ink:#0E1513; --accent-soft:#1E3330;
    --warn:#D8A054; --warn-soft:#332A1B; --danger:#D8756B; --danger-soft:#33201E;
    --ok:#5FB07E; --ok-soft:#1D2E24; --shadow:0 1px 3px rgba(0,0,0,.35); }
  :root[data-theme="light"]{ --bg:#F4F6F5; --card:#FFFFFF; --ink:#1C2826; --ink2:#5B6B67; --line:#DDE4E1;
    --accent:#0E6E62; --accent-ink:#FFFFFF; --accent-soft:#E2F0ED;
    --warn:#B4762A; --warn-soft:#F6EBDA; --danger:#B0453C; --danger-soft:#F4E3E1;
    --ok:#2E7D4F; --ok-soft:#E1EFE6; --shadow:0 1px 3px rgba(28,40,38,.08); }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    padding-bottom:76px}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 24px}
  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 14px}
  header.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
  header.top .date{font-size:13px;color:var(--ink2)}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:14px;margin-top:12px}
  .card h3{margin:0;font-size:16px;font-weight:700}
  .sub{font-size:13px;color:var(--ink2);margin-top:2px}
  .last{font-size:13px;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}
  .last b{color:var(--ink)}

  .badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;margin-top:8px}
  .badge.up{background:var(--ok-soft);color:var(--ok)}
  .badge.warm{background:var(--warn-soft);color:var(--warn)}

  .sets{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .setrow{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:center}
  .setrow.single{grid-template-columns:52px 1fr}
  .setlbl{font-size:12px;font-weight:700;color:var(--ink2)}
  input[type=number],input[type=text],input[type=date],select,textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);
    color:var(--ink);padding:10px;font-size:16px;font-variant-numeric:tabular-nums}
  textarea{resize:vertical;min-height:40px}
  label.mini{font-size:12px;color:var(--ink2);display:block;margin-bottom:3px}

  details.how{margin-top:10px}
  details.how summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
  details.how p{font-size:13.5px;color:var(--ink2);margin:8px 0 0}

  .checkline{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .checkline:last-child{border-bottom:0}
  .checkline input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto;margin-top:1px}
  .checkline span{font-size:14.5px}

  button.big{width:100%;border:0;border-radius:var(--r);padding:14px;font-size:16px;font-weight:700;
    background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:14px}
  button.ghost{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:15px;
    font-weight:600;background:var(--card);color:var(--ink);cursor:pointer;margin-top:10px}
  button.danger{border-color:var(--danger);color:var(--danger)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px}
  .stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat .k{font-size:12px;color:var(--ink2)}
  .delta{font-size:12px;font-weight:700}
  .delta.down{color:var(--ok)} .delta.upbad{color:var(--danger)} .delta.flat{color:var(--ink2)}

  table.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  table.hist td,table.hist th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
  table.hist th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2)}
  .scrollx{overflow-x:auto}

  .painrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pain{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
  .pain.on{background:var(--danger);border-color:var(--danger);color:#fff}
  .pain.on.low{background:var(--ok);border-color:var(--ok)}
  .pain.on.mid{background:var(--warn);border-color:var(--warn)}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{border:0;background:none;color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:8px}
  nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
  nav.tabs .ico{font-size:19px}

  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .note{font-size:13px;color:var(--ink2);margin-top:8px}
  .warnbox{background:var(--danger-soft);color:var(--danger);border-radius:var(--r);padding:10px 12px;font-size:13.5px;font-weight:600;margin-top:12px}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:20px 2px 0}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Bel Dostu Program</div>
      <h1>Antrenman Takip</h1>
    </div>

<script>

/* ================= VERİ ================= */

    {id:"stepup", n:"Alçak basamağa step-up", sets:2, rep:"10/bacak", repTop:10, rest:"60 sn", start:"ağırlıksız", type:"wr",

const WARMUP = [
  "Yürüyüş bandı 5 dk (hız 5–5,5, eğim %2–3)",
  "Cat-camel × 8 (ağrısız aralıkta, akıcı)",
  "McGill curl-up 2×5 (5 sn tutuş — eller bel altında)",
  "Yan köprü (dizden) her yan 2×5 (7–10 sn)",
  "Bird-dog her çapraz 2×5 (bel çukurlaşmaz)",
  "Clamshell (lastikli) her yan 1×12"
];
const METRIC_DEFS = [
  {id:"kilo", n:"Kilo", unit:"kg", freq:"haftada 1 — aynı gün, sabah aç, tuvalet sonrası", goodDown:true},
  {id:"bel", n:"Bel çevresi", unit:"cm", freq:"2 haftada 1 — göbek deliği hizasından", goodDown:true},
  {id:"adim", n:"Adım", unit:"adım", freq:"günlük (hedef: 6.000'den başla, +1.000/hafta → 10.000)", goodDown:false},
  {id:"plankR", n:"Yan köprü SAĞ", unit:"sn", freq:"4 haftada 1", goodDown:false},
  {id:"plankL", n:"Yan köprü SOL", unit:"sn", freq:"4 haftada 1 — sağ/sol farkı %10 altına inmeli", goodDown:false}
];

let storageOK = true;
try{
  localStorage.setItem("__depo_testi","1");
  if(localStorage.getItem("__depo_testi")!=="1") storageOK=false;
  localStorage.removeItem("__depo_testi");
}catch(e){ storageOK=false; }

let db = load();
function load(){
  try{ const raw = localStorage.getItem(DB_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {sessions:{}, metrics:{}, pain:{}, ui:{day:"gun1"}};
}
function save(){
  db.ui.savedAt = Date.now();
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e){ toast("Kaydedilemedi! Tarayıcı depolaması dolu olabilir."); }
}
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = iso => { const [y,m,d]=iso.split("-"); return `${d}.${m}.${y}`; };
let curDate = today(), curDay = db.ui.day || "gun1", curTab = "workout";

function sKey(date,day){ return date+"_"+day; }
function getSession(date,day){
  const k=sKey(date,day);
  if(!db.sessions[k]) db.sessions[k]={date,day,ex:{},warm:[],done:false};
  return db.sessions[k];
}
function getEx(sess,ex){
  if(!sess.ex[ex.id]) sess.ex[ex.id]={sets:Array.from({length:ex.sets},()=>({w:"",r:""})),note:"",chk:false};
  const e=sess.ex[ex.id];
  while(e.sets.length<ex.sets) e.sets.push({w:"",r:""});
  return e;
}
function lastSession(exId, beforeKey){
  const keys=Object.keys(db.sessions)
    .filter(k=>k!==beforeKey && db.sessions[k].ex[exId])
    .filter(k=>{ const e=db.sessions[k].ex[exId];
      return e.chk || e.sets.some(s=>s.w!==""||s.r!==""); })
    .sort((a,b)=> db.sessions[b].date.localeCompare(db.sessions[a].date));
  return keys.length? db.sessions[keys[0]] : null;
}

/* ================= GÖRÜNÜMLER ================= */
const view = document.getElementById("view");
document.getElementById("todayLbl").textContent = fmtDate(today());

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}

function sessionHasContent(s){
  return !!(s && (s.done || (s.warm&&s.warm.length) ||
    Object.values(s.ex||{}).some(e=>e.chk || (e.sets||[]).some(x=>x.w!==""||x.r!==""))));
}
function hasData(){
  return Object.values(db.sessions).some(sessionHasContent)
    || Object.values(db.metrics).some(a=>a&&a.length)
    || Object.keys(db.pain).length>0;
}
function backupStale(){
  const lb=db.ui.lastBackup;
  return !lb || (Date.now()-new Date(lb+"T00:00:00").getTime())/86400000 >= 7;
}
async function downloadBackup(){
  const data=JSON.stringify(db,null,1);
  const fn="antrenman-yedek-"+today()+".json";
  try{
    if(window.claude && window.claude.downloads){
      await window.claude.downloads.save({filename:fn, data:data});
    }else{
      const blob=new Blob([data],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download=fn; a.click(); URL.revokeObjectURL(a.href);
    }
    db.ui.lastBackup=today(); save(); renderAlerts(); toast("Yedek kaydedildi ✓");
    return true;
  }catch(err){
    if(err&&err.code==="declined") toast("Yedek indirme iptal edildi");
    else if(err&&err.code==="rate_limited") toast("Biraz bekleyip tekrar dene");
    else toast("İndirilemedi — Yedek sekmesinden tekrar dene");
    return false;
  }
}
/* ---- GOOGLE DRIVE BULUT KAYDI ---- */
const DRIVE_FILE = "antrenman-takip-verileri.json";
let DRIVE_NAME = "Google Drive";
let driveReady = false, driveMsg = "", cloudBusy = false, pendingCloud = null;

function mcpOn(){ return typeof window!=="undefined" && window.claude && window.claude.mcp !== undefined; }
function driveErrText(e){
  const c = e && e.code;
  if(c==="needs_reauth") return "Google Drive bağlantısının süresi dolmuş. claude.ai → Ayarlar → Bağlayıcılar'dan Drive'ı yeniden bağla.";
  if(c==="server_not_connected") return "Google Drive bağlı değil. claude.ai → Ayarlar → Bağlayıcılar'dan Google Drive'ı ekle.";
  if(c==="selection_required") return "Birden fazla Drive bağlayıcısı var — sayfa açılınca çıkan seçim istemini onayla.";
  if(c==="blocked_by_policy"||c==="approval_required") return "Kuruluş ayarların Drive erişimine izin vermiyor.";
  if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed") return "Bu görünümde Drive erişimi yok.";
  if(c==="tool_error") return "Drive işlemi hata verdi: " + (e.message||"");
  return "Drive'a şu an ulaşılamadı" + (e&&e.message? " ("+e.message+")" : "") + ". Biraz sonra tekrar dene.";
}
async function driveCall(tool, input, opts){
  try{ return await window.claude.mcp.callTool(DRIVE_NAME, tool, input, opts); }
  catch(e){
    if(e && e.retryable){
      await new Promise(r=>setTimeout(r,(e.retryAfterMs||1500)+Math.random()*500));
      return await window.claude.mcp.callTool(DRIVE_NAME, tool, input, opts);
    }
    throw e;
  }
}
function pickList(p){
  if(Array.isArray(p)) return p;
  if(p && typeof p==="object"){
    for(const k of ["files","items","results","data","fileList"]) if(Array.isArray(p[k])) return p[k];
  }
  return [];
}
function fileIdOf(f){ return f && (f.fileId||f.id||(f.file&&(f.file.id||f.file.fileId))) || null; }
function fileTimeOf(f){ return (f && (f.createdTime||f.modifiedTime||f.created_time||f.modified_time||f.createdAt||"")) || ""; }
function b64ToText(b64){
  const bin=atob(String(b64).replace(/\s/g,""));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function parseDbCandidate(x){
  if(!x) return null;
  if(typeof x==="object" && x.sessions && x.metrics) return x;
  if(typeof x==="string"){
    try{ const j=JSON.parse(x); if(j&&j.sessions&&j.metrics) return j; }catch(e){}
    try{ const j=JSON.parse(b64ToText(x)); if(j&&j.sessions&&j.metrics) return j; }catch(e){}
  }
  return null;
}
function decodeDownload(p){
  let d = parseDbCandidate(p); if(d) return d;
  if(p && typeof p==="object"){
    for(const k of ["base64Content","content","data","textContent","text","body"]){
      d = parseDbCandidate(p[k]); if(d) return d;
    }
  }
  return null;
}
function dataScore(d){
  if(!d) return 0;
  return Object.keys(d.sessions||{}).length*10
       + Object.values(d.metrics||{}).reduce((a,x)=>a+(x?x.length:0),0)
       + Object.keys(d.pain||{}).length;
}
async function driveFetchLatest(){
  const q = "title = '"+DRIVE_FILE+"'";
  const res = await driveCall("search_files", {query:q, pageSize:10, excludeContentSnippets:true}, {cache:false});
  const list = pickList(res && res.payload).slice()
    .sort((a,b)=> String(fileTimeOf(b)).localeCompare(String(fileTimeOf(a))));
  for(const f of list){
    const id = fileIdOf(f); if(!id) continue;
    try{
      const dl = await driveCall("download_file_content", {fileId:id}, {cache:false});
      const d = decodeDownload(dl && dl.payload);
      if(d) return d;
    }catch(e){ /* sıradaki dosyayı dene */ }
  }
  return null;
}
async function driveSave(showToast){
  if(!driveReady || cloudBusy) return false;
  cloudBusy = true; if(showToast) toast("Drive'a kaydediliyor…");
  try{
    await driveCall("create_file", {
      title: DRIVE_FILE,
      textContent: JSON.stringify(db),
      contentMimeType: "application/json",
      disableConversionToGoogleType: true
    });
    db.ui.lastCloud = new Date().toISOString();
    save();
    toast("Google Drive'a kaydedildi ☁️✓");
    cloudBusy=false; if(curTab==="backup") render();
    return true;
  }catch(e){
    cloudBusy=false;
    driveMsg = driveErrText(e);
    toast("Drive kaydı BAŞARISIZ — Yedek sekmesine bak");
    if(curTab==="backup") render();
    return false;
  }
}
async function driveRestore(d){
  const keepUi = Object.assign({}, d.ui||{}, {day: db.ui.day});
  db = d; db.ui = keepUi; if(!db.pain) db.pain={};
  save(); pendingCloud=null; render();
  toast("Drive'daki kayıtların geri yüklendi ☁️");
}
async function driveInit(){
  if(!mcpOn()) return;
  try{
    const lt = await window.claude.mcp.listTools();
    const servers = (lt && lt.servers) || [];
    let srv = servers.find(s=>s.server===DRIVE_NAME) || servers.find(s=>/drive/i.test(s.server||""));
    if(!srv || !srv.tools || !srv.tools.length){ driveMsg = driveErrText({code:"server_not_connected"}); renderAlerts(); return; }
    if(srv.authStatus==="needs_reauth"){ driveMsg = driveErrText({code:"needs_reauth"}); renderAlerts(); return; }
    DRIVE_NAME = srv.server; driveReady = true; driveMsg="";
    renderAlerts(); if(curTab==="backup") render();
    const cloud = await driveFetchLatest();
    if(cloud){
      const cloudAt = (cloud.ui&&cloud.ui.savedAt)||0, localAt=(db.ui&&db.ui.savedAt)||0;
      if(!hasData() && dataScore(cloud)>0){ await driveRestore(cloud); }
      else if(dataScore(cloud)>0 && cloudAt>localAt){ pendingCloud=cloud; renderAlerts(); }
    }
  }catch(e){ driveMsg = driveErrText(e); renderAlerts(); }
}

function renderAlerts(){
  const el=document.getElementById("alerts"); let h="";
  if(pendingCloud){
    h+=`<div class="warnbox" style="background:var(--accent-soft);color:var(--accent)">☁️ Google Drive'da bu cihazdakinden DAHA YENİ kayıt bulundu.
    <button class="ghost" id="cloudRestoreBtn" style="margin-top:8px">Drive'daki kaydı yükle</button></div>`;
  }
  if(driveMsg && !driveReady){
    h+=`<div class="warnbox">☁️ ${esc(driveMsg)}</div>`;
  }
  if(!storageOK && !driveReady){
    h+=`<div class="warnbox">⛔ Bu ekran kayıt TUTAMIYOR (dosya önizlemesi veya kısıtlı tarayıcı). Burada girdiğin hiçbir şey saklanmaz! Linki Safari ya da Chrome'da aç, öyle kullan.</div>`;
  }else if(!driveReady && hasData() && backupStale()){
    h=`<div class="warnbox">⚠️ ${db.ui.lastBackup?`Son yedek: ${fmtDate(db.ui.lastBackup)} — 7 günden eski.`:"Henüz hiç yedek almadın."} Kayıtlar yalnızca bu tarayıcıda durur; kaybolmadan yedeğini indir.
    <button class="ghost" id="quickBackup" style="margin-top:8px">Yedeği şimdi indir (.json)</button></div>`;
  }
  el.innerHTML=h;
  const qb=document.getElementById("quickBackup");
  if(qb) qb.onclick=downloadBackup;
  const cr=document.getElementById("cloudRestoreBtn");
  if(cr) cr.onclick=()=>driveRestore(pendingCloud);
}
function render(){
  renderAlerts();
  if(curTab==="workout") renderWorkout();
  else if(curTab==="metrics") renderMetrics();
  else if(curTab==="history") renderHistory();
  else renderBackup();
}

/* ---- ÖLÇÜMLER ---- */
function renderMetrics(){
  let h=`<h2 class="sec">Vücut ölçümleri</h2>`;
  METRIC_DEFS.forEach(m=>{
    const arr=(db.metrics[m.id]||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
    const lastV=arr.length?arr[arr.length-1]:null;
    const prevV=arr.length>1?arr[arr.length-2]:null;
    let delta="";
    if(lastV&&prevV){
      const d=Number(lastV.v)-Number(prevV.v);
      const good=(m.goodDown&&d<0)||(!m.goodDown&&d>0);
      const cls=d===0?"flat":(good?"down":"upbad");
      delta=`<span class="delta ${cls}">${d>0?"+":""}${Math.round(d*10)/10} ${m.unit}</span>`;
    }
    h+=`<div class="card"><h3>${m.n} <span class="sub" style="display:inline">(${m.unit})</span></h3>
      <div class="sub">${esc(m.freq)}</div>
      ${lastV?`<div class="last">Son: <b>${esc(lastV.v)} ${m.unit}</b> (${fmtDate(lastV.d)}) ${delta}</div>`:`<div class="last">Henüz kayıt yok</div>`}
      <div class="setrow" style="margin-top:10px">
        <span class="setlbl">Bugün</span>
        <input type="number" inputmode="decimal" step="0.1" placeholder="${m.unit}" id="min_${m.id}" aria-label="${m.n} değeri">
        <button class="ghost" style="margin-top:0" data-msave="${m.id}">Kaydet</button>
      </div>
      ${arr.length?`<details class="how"><summary>Tüm kayıtlar (${arr.length})</summary><div class="scrollx"><table class="hist"><tr><th>Tarih</th><th>${m.unit}</th></tr>${
        arr.slice().reverse().map(r=>`<tr><td>${fmtDate(r.d)}</td><td>${esc(r.v)}</td></tr>`).join("")
      }</table></div></details>`:""}
    </div>`;
  });
  const kilo=(db.metrics.kilo||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
  if(kilo.length){
    const first=Number(kilo[0].v), last=Number(kilo[kilo.length-1].v);
    h=`<div class="grid2">
      <div class="stat"><div class="v">${last} kg</div><div class="k">güncel kilo</div></div>
      <div class="stat"><div class="v">${Math.round((first-last)*10)/10} kg</div><div class="k">toplam kayıp (başlangıç ${first} kg)</div></div>
    </div>`+h;
    h+=`<div class="note">Hedef hız: haftada 0,5–0,75 kg. 2 haftalık ortalama bunun altındaysa −200 kcal; üstünde >1 kg ise +200 kcal (kas koruması).</div>`;
  }
  view.innerHTML=h;
  view.querySelectorAll("[data-msave]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.msave, inp=view.querySelector("#min_"+id);
    if(inp.value===""){ toast("Önce değer gir"); return; }
    if(!db.metrics[id]) db.metrics[id]=[];
    db.metrics[id]=db.metrics[id].filter(r=>r.d!==today());
    db.metrics[id].push({d:today(), v:inp.value});
    save(); render(); toast("Ölçüm kaydedildi");
  });
}

function renderHistory(){
  const keys=Object.keys(db.sessions)
    .filter(k=>{ const s=db.sessions[k];
      return s.done || s.warm.length || Object.values(s.ex).some(e=>e.chk||e.sets.some(x=>x.w!==""||x.r!==""));})
    .sort((a,b)=> db.sessions[b].date.localeCompare(db.sessions[a].date));

  if(!keys.length) h+=`<div class="card"><div class="sub">Henüz kayıtlı antrenman yok. İlk seansını Antrenman sekmesinden kaydet.</div></div>`;
  keys.forEach(k=>{
    const s=db.sessions[k], day=DAYS[s.day];
    if(!day) return;
    let vol=0, lines="";
    day.ex.forEach(ex=>{
      const e=s.ex[ex.id]; if(!e) return;
      if(ex.type==="wr"){
        const parts=e.sets.filter(x=>x.w!==""||x.r!=="").map(x=>{ vol+=(Number(x.w)||0)*(Number(x.r)||0); return `${x.w||"?"}×${x.r||"?"}`;});
        if(parts.length) lines+=`<tr><td>${esc(ex.n)}</td><td>${parts.join(" · ")}</td></tr>`;
      }else if(ex.type==="time"){
        const parts=e.sets.filter(x=>x.r!=="").map(x=>`${x.r} sn`);
        if(parts.length) lines+=`<tr><td>${esc(ex.n)}</td><td>${parts.join(" · ")}</td></tr>`;
      }else if(ex.type==="cardio"){
        if(e.sets[0]&&(e.sets[0].r!==""||e.sets[0].w!==""))
          lines+=`<tr><td>${esc(ex.n)}</td><td>${e.sets[0].r||"?"} dk${e.sets[0].w?` · ${esc(e.sets[0].w)}`:""}</td></tr>`;
      }else if(e.chk){ lines+=`<tr><td>${esc(ex.n)}</td><td>✓</td></tr>`; }
      if(e.note) lines+=`<tr><td class="sub">↳ not</td><td class="sub">${esc(e.note)}</td></tr>`;
    });
    const pain=db.pain[s.date];
    h+=`<div class="card"><h3>${fmtDate(s.date)} — ${esc(day.name)} ${s.done?'<span class="badge up">tamamlandı</span>':'<span class="badge warm">yarım</span>'}</h3>
      <div class="sub">Isınma ${s.warm.length}/${WARMUP.length}${vol?` · toplam hacim ~${Math.round(vol)} kg`:""}${pain!==undefined?` · ağrı ${pain}/10`:""}</div>
      ${lines?`<details class="how"><summary>Detaylar</summary><div class="scrollx"><table class="hist">${lines}</table></div></details>`:""}
      <button class="ghost danger" data-del="${k}">Bu seansı sil</button>
    </div>`;
  });
  const pains=Object.keys(db.pain).sort().reverse().slice(0,14);
  if(pains.length){
    h+=`<h2 class="sec">Ağrı günlüğü (son 14 kayıt)</h2><div class="card"><div class="scrollx"><table class="hist"><tr><th>Tarih</th><th>Ağrı</th></tr>${
      pains.map(d=>`<tr><td>${fmtDate(d)}</td><td>${db.pain[d]}/10</td></tr>`).join("")}</table></div></div>`;
  }
  view.innerHTML=h;
  view.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(confirm("Bu seans kaydı silinsin mi? Geri alınamaz.")){ delete db.sessions[b.dataset.del]; save(); render(); }
  });
}

  <div class="card"><h3>☁️ Google Drive bulut kaydı ${driveReady?'<span class="badge up">aktif</span>':'<span class="badge warm">bağlı değil</span>'}</h3>
    <p class="note">${driveReady
      ? `Kayıtların <b>${esc(DRIVE_NAME)}</b> hesabına <code>${DRIVE_FILE}</code> adıyla yazılır. Her "Antrenmanı bitir"de otomatik kaydedilir; uygulama açılınca Drive'daki en yeni kayıt aranır. Her kayıt Drive'da yeni bir sürüm dosyası oluşturur — eskileri Drive'dan silebilirsin.${db.ui.lastCloud?`<br>Son Drive kaydı: <b>${new Date(db.ui.lastCloud).toLocaleString("tr-TR")}</b>`:""}`
      : esc(driveMsg||"Drive bağlantısı bekleniyor…")}</p>
    ${driveReady?`<button class="big" id="cloudSaveBtn">Drive'a şimdi kaydet</button>
    <button class="ghost" id="cloudLoadBtn">Drive'daki en yeni kaydı getir</button>`:""}
  </div>` : "";
  view.innerHTML=`${cloudCard}
  <div class="card"><h3>Verilerin nerede?</h3>
    <p class="note">${driveReady
      ? `Ana kayıt yerin <b>Google Drive</b> (yukarıda). Aşağıdaki dosya yedeği ek bir sigortadır.`
      : `Tüm kayıtların <b>bu cihazda, bu tarayıcının kalıcı hafızasında</b> tutulur. Tarayıcı verilerini temizlersen veya başka cihazdan açarsan görünmez. Bu yüzden <b>haftada bir yedek indir.</b>`}</p></div>
  <div class="card"><h3>Yedek al</h3>
    <p class="note">${count} seans + ölçümler tek dosyada iner. Dosyayı telefonuna/Google Drive'a kaydet.
    ${db.ui.lastBackup?`<br>Son yedek: <b>${fmtDate(db.ui.lastBackup)}</b>`:"<br><b>Henüz hiç yedek alınmadı.</b>"}</p>
    <button class="big" id="expBtn">Yedeği indir (.json)</button>
    <button class="ghost" id="copyBtn">Panoya kopyala</button></div>
  <div class="card"><h3>Yedekten geri yükle</h3>
    <p class="note">Daha önce indirdiğin .json dosyasını seç. Mevcut verilerin üzerine yazılır.</p>
    <input type="file" id="impFile" accept=".json,application/json"></div>
  <div class="card"><h3>Sıfırla</h3>
    <button class="ghost danger" id="wipeBtn">Tüm verileri sil</button></div>`;
  const csb=view.querySelector("#cloudSaveBtn");
  if(csb) csb.onclick=()=>driveSave(true);
  const clb=view.querySelector("#cloudLoadBtn");
  if(clb) clb.onclick=async()=>{
    toast("Drive'da aranıyor…");
    try{
      const cloud=await driveFetchLatest();
      if(!cloud){ toast("Drive'da kayıt bulunamadı"); return; }
      if(!hasData() || confirm("Drive'daki kayıt bu cihazdakinin ÜZERİNE yazılacak. Devam?")) await driveRestore(cloud);
    }catch(e){ driveMsg=driveErrText(e); toast("Drive'a ulaşılamadı"); render(); }
  };
  view.querySelector("#expBtn").onclick=async()=>{ if(await downloadBackup()) render(); };
  view.querySelector("#copyBtn").onclick=async()=>{
    try{ await navigator.clipboard.writeText(JSON.stringify(db)); toast("Panoya kopyalandı"); }
    catch(e){ toast("Kopyalanamadı — Yedeği indir'i kullan"); }
  };
  view.querySelector("#impFile").onchange=ev=>{
    const f=ev.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(!d.sessions||!d.metrics) throw 0;
        db=d; save(); toast("Yedek geri yüklendi"); render();
      }catch(e){ toast("Dosya okunamadı — geçerli bir yedek değil"); } };
    r.readAsText(f);
  };
  view.querySelector("#wipeBtn").onclick=()=>{
    if(confirm("TÜM antrenman ve ölçüm kayıtların silinecek. Emin misin?")&&confirm("Son kez: geri alınamaz. Silinsin mi?")){
      db={sessions:{},metrics:{},pain:{},ui:{day:"gun1"}}; save(); render(); toast("Sıfırlandı");
    }
  };
}

/* ---- SEKMELER ---- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  curTab=b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("on",x===b));
  render(); window.scrollTo(0,0);
});
render();
driveInit();
</script>
